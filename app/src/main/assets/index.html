<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Sakuga TV</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: transparent; color: #fff;
    font-family: sans-serif; overflow: hidden;
    height: 100vh; width: 100vw; user-select: none;
  }
  .vig {
    position: fixed; inset: 0; z-index: -1;
    background: linear-gradient(180deg,
      rgba(7,8,12,.35) 0%, rgba(7,8,12,.08) 50%,
      rgba(7,8,12,.78) 100%);
    transition: opacity 0.8s linear;
  }
  #ui { height: 100vh; transition: opacity 0.8s; }
  body.afk #ui { opacity: 0; pointer-events: none; }
  body.afk .vig { opacity: 0.08; }

  /* Блок времени и даты для режима АФК */
  #afk-box {
    position: fixed; bottom: 42px; right: 55px;
    text-align: right; opacity: 0;
    transition: opacity 0.8s;
  }
  body.afk #afk-box { opacity: 1; }
  #afk-clk {
    font-size: 40px; font-weight: 300;
    color: rgba(255,255,255,.65);
    letter-spacing: 2px;
  }
  #afk-date {
    font-size: 16px; letter-spacing: 1.5px;
    color: rgba(255,255,255,.45);
    margin-top: 4px; text-transform: uppercase;
  }

  header {
    display: flex; justify-content: space-between;
    align-items: center; padding: 36px 55px;
  }
  .badge {
    background: rgba(15,18,26,.42);
    padding: 7px 16px; border-radius: 16px;
    font-size: 13px; letter-spacing: 1.5px;
    border: 1px solid rgba(255,255,255,.15);
    color: rgba(255,255,255,.8);
  }
  .top-r {
    display: flex; align-items: center; gap: 14px;
  }
  #clk {
    font-size: 36px; font-weight: 300;
    margin-right: 6px;
  }
  .t-btn {
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(15,18,26,.42);
    border: 1.5px solid rgba(255,255,255,.18);
    display: flex; justify-content: center;
    align-items: center;
    transition: transform 0.18s ease,
                border-color 0.18s,
                background 0.18s;
  }
  .t-btn svg {
    width: 20px; height: 20px; fill: #e0e6ed;
  }
  .t-btn.foc {
    transform: scale(1.12); border-color: #7aa2f7;
    background: rgba(45,55,85,.72);
  }
  main {
    position: absolute; bottom: 48px;
    left: 55px; right: 55px;
  }
  .sec-t {
    font-size: 13px; text-transform: uppercase;
    letter-spacing: 2px; color: #ffffff99;
    margin-bottom: 14px;
  }
  .dock { display: flex; gap: 18px; }
  .card {
    width: 210px; height: 96px;
    border-radius: 16px; padding: 14px 18px;
    background: rgba(15,18,26,.42);
    border: 1.5px solid rgba(255,255,255,.16);
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    gap: 5px;
    transition: transform 0.18s ease,
                border-color 0.18s,
                background 0.18s;
  }
  .card.lg {
    width: 330px;
    border-color: rgba(168,130,255,.28);
    background: rgba(28,20,48,.46);
  }
  .card.foc {
    transform: scale(1.04) translateY(-3px);
    background: rgba(35,44,68,.72);
    border-color: #7aa2f7;
  }
  .card.lg.foc {
    border-color: #bb9af7;
    background: rgba(56,34,96,.75);
  }
  .nm { font-size: 17px; font-weight: 600; }
  .sb { font-size: 12px; color: #ffffff99; }

  .modal {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(9,10,16,.92);
    padding: 45px 60px; display: none;
    flex-direction: column;
  }
  .modal.open { display: flex; }
  .m-head {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 22px;
  }
  .tabs {
    display: none; gap: 14px; margin-bottom: 24px;
  }
  .tabs.show { display: flex; }
  .tab {
    padding: 10px 22px; border-radius: 12px;
    background: rgba(255,255,255,.07);
    border: 1.5px solid transparent;
    font-size: 15px; color: #ffffff99;
  }
  .tab.act {
    background: rgba(122,162,247,.2);
    color: #fff; border-color: #7aa2f780;
  }
  .tab.foc {
    border-color: #bb9af7; color: #fff;
    transform: scale(1.03);
  }
  .m-grid {
    display: grid; gap: 16px; overflow-y: auto;
    grid-template-columns: repeat(4, 1fr);
    padding: 8px;
  }
  .m-item {
    background: rgba(255,255,255,.07);
    border: 1.5px solid rgba(255,255,255,.14);
    border-radius: 14px; padding: 18px;
    text-align: center; font-size: 16px;
    overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap;
  }
  .m-item.foc {
    background: rgba(122,162,247,.28);
    border-color: #7aa2f7;
    transform: scale(1.03);
  }
</style>
</head>
<body>

<div class="vig"></div>
<div id="afk-box">
  <div id="afk-clk">00:00</div>
  <div id="afk-date">1 января</div>
</div>

<div id="ui">
  <header>
    <div class="badge">SAKUGA TV</div>
    <div class="top-r">
      <div id="clk">00:00</div>
      <!-- Кнопка выбора фона (векторная иконка) -->
      <div class="t-btn nav" data-r="top"
           data-act="vids">
        <svg viewBox="0 0 24 24"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/></svg>
      </div>
      <!-- Кнопка настроек (векторная шестерёнка) -->
      <div class="t-btn nav" data-r="top"
           data-act="settings">
        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1112 8.4a3.6 3.6 0 010 7.2z"/></svg>
      </div>
    </div>
  </header>

  <main>
    <div class="sec-t">Кинотеатр и сервисы</div>
    <div class="dock">
      <div class="card lg nav foc" data-r="bot"
           data-act="ru.ivi.client">
        <div class="nm">Аниме и Фильмы</div>
        <div class="sb">Открыть в ИВИ</div>
      </div>
      <div class="card nav" data-r="bot"
           data-act="ru.kinopoisk.tv">
        <div class="nm">Кинопоиск</div>
        <div class="sb">Фильмы и сериалы</div>
      </div>
      <div class="card nav" data-r="bot"
           data-act="apps">
        <div class="nm">Все приложения</div>
        <div class="sb">Меню программ ТВ</div>
      </div>
    </div>
  </main>
</div>

<div class="modal" id="modal">
  <div class="m-head">
    <h2 id="m-title">Меню</h2>
    <span style="color:#ffffff80">
      «Назад» на пульте для выхода
    </span>
  </div>
  <div class="tabs" id="m-tabs">
    <div class="tab act" data-tab="norm">
      Обычный фон
    </div>
    <div class="tab" data-tab="afk">
      Режим АФК (сон)
    </div>
  </div>
  <div class="m-grid" id="m-grid"></div>
</div>
<script>
  const normList = [
    'sakuga1.mp4', 'sakuga2.mp4', 'sakuga3.mp4'
  ];
  const afkList = ['afk1.mp4', 'afk2.mp4'];
  const AFK_MS = 120000;
  const MONTHS = [
    'января', 'февраля', 'марта', 'апреля',
    'мая', 'июня', 'июля', 'августа',
    'сентября', 'октября', 'ноября', 'декабря'
  ];

  let normMode = 'seq', afkMode = 'seq';
  let vIdx = 0, isAfk = false, errCount = 0;
  let afkTimer = null, modalMode = null;

  function playVid(name, loop) {
    if (window.AndroidLauncher &&
        window.AndroidLauncher.playVideo) {
      window.AndroidLauncher.playVideo(name, !!loop);
    }
  }

  function startMode(mode, arr) {
    errCount = 0;
    if (mode === 'seq') {
      vIdx = 0;
      playVid(arr[0], false);
    } else if (mode === 'rnd') {
      vIdx = Math.floor(Math.random() * arr.length);
      playVid(arr[vIdx], false);
    } else {
      playVid(mode, true);
    }
  }

  startMode(normMode, normList);

  function onVideoEnded() {
    const arr = isAfk ? afkList : normList;
    const mode = isAfk ? afkMode : normMode;
    if (mode !== 'seq' && mode !== 'rnd') return;

    errCount++;
    if (errCount > arr.length + 1) return;

    if (mode === 'rnd' && arr.length > 1) {
      let next = vIdx;
      while (next === vIdx) {
        next = Math.floor(Math.random() * arr.length);
      }
      vIdx = next;
    } else {
      vIdx = (vIdx + 1) % arr.length;
    }
    setTimeout(() => {
      errCount = 0;
      playVid(arr[vIdx], false);
    }, 100);
  }

  function onHardwareBack() {
    if (isAfk) { resetAfk(); return; }
    if (modalMode) { closeModal(); }
  }

  function setAfk(st) {
    if (isAfk === st) return;
    isAfk = st;
    document.body.classList.toggle('afk', st);
    if (st) startMode(afkMode, afkList);
    else startMode(normMode, normList);
  }

  function resetAfk() {
    clearTimeout(afkTimer);
    if (!modalMode) {
      afkTimer = setTimeout(() => setAfk(true), AFK_MS);
    }
    if (isAfk) setAfk(false);
  }
  resetAfk();

  function tick() {
    const d = new Date();
    const h = String(d.getHours()).padStart(2, '0');
    const m = String(d.getMinutes()).padStart(2, '0');
    const day = d.getDate();
    const mon = MONTHS[d.getMonth()];
    document.getElementById('clk').textContent = h+':'+m;
    document.getElementById('afk-clk').textContent = h+':'+m;
    document.getElementById('afk-date').textContent =
      day + ' ' + mon;
  }
  setInterval(tick, 1000); tick();

  const topEls = Array.from(
    document.querySelectorAll('[data-r="top"]')
  );
  const botEls = Array.from(
    document.querySelectorAll('[data-r="bot"]')
  );
  const tabEls = Array.from(
    document.querySelectorAll('.tab')
  );
  let row = 'bot', tIdx = 0, bIdx = 0;
  let mArea = 'grid', tabIdx = 0, vidTab = 'norm';
  let mEls = [], mIdx = 0;

  function renderFoc() {
    document.querySelectorAll('.nav')
      .forEach(e => e.classList.remove('foc'));
    if (row === 'top') topEls[tIdx].classList.add('foc');
    else botEls[bIdx].classList.add('foc');
  }

  function buildVidGrid() {
    const grid = document.getElementById('m-grid');
    grid.innerHTML = '';
    const arr = vidTab === 'norm' ? normList : afkList;
    const items = [
      {name: 'По очереди', val: 'seq'},
      {name: 'Случайно', val: 'rnd'}
    ];
    arr.forEach(v => {
      items.push({name: v, val: v});
    });
    items.forEach((it) => {
      const div = document.createElement('div');
      div.className = 'm-item';
      div.textContent = it.name;
      div.dataset.val = it.val;
      grid.appendChild(div);
    });
    mEls = Array.from(
      document.querySelectorAll('.m-item')
    );
    mIdx = 0;
  }

  function openModal(mode) {
    modalMode = mode;
    clearTimeout(afkTimer);
    const grid = document.getElementById('m-grid');
    const title = document.getElementById('m-title');
    const tabs = document.getElementById('m-tabs');
    grid.innerHTML = '';

    if (mode === 'apps') {
      title.textContent = 'Все приложения';
      tabs.classList.remove('show');
      mArea = 'grid';
      let items = [];
      if (window.AndroidLauncher &&
          window.AndroidLauncher.getApps) {
        items = JSON.parse(
          window.AndroidLauncher.getApps()
        );
      }
      items.forEach((it) => {
        const div = document.createElement('div');
        div.className = 'm-item';
        div.textContent = it.name;
        div.dataset.val = it.pkg;
        grid.appendChild(div);
      });
      mEls = Array.from(
        document.querySelectorAll('.m-item')
      );
      mIdx = 0;
    } else if (mode === 'vids') {
      title.textContent = 'Настройка фонового видео';
      tabs.classList.add('show');
      vidTab = 'norm'; tabIdx = 0; mArea = 'grid';
      buildVidGrid();
    }
    updModalFoc();
    document.getElementById('modal')
      .classList.add('open');
  }

  function closeModal() {
    modalMode = null;
    document.getElementById('modal')
      .classList.remove('open');
    resetAfk();
  }

  function updModalFoc() {
    tabEls.forEach((t, i) => {
      t.classList.toggle('act', t.dataset.tab === vidTab);
      t.classList.toggle(
        'foc', modalMode === 'vids' &&
        mArea === 'tabs' && i === tabIdx
      );
    });
    mEls.forEach((el, i) => {
      el.classList.toggle(
        'foc', mArea === 'grid' && i === mIdx
      );
    });
    if (mArea === 'grid' && mEls[mIdx]) {
      mEls[mIdx].scrollIntoView({block: 'nearest'});
    }
  }

  document.addEventListener('keydown', (e) => {
    if (isAfk) { resetAfk(); return; }
    resetAfk();

    if (modalMode) {
      if (['Escape','Backspace','GoBack']
          .includes(e.key)) {
        closeModal();
      } else if (mArea === 'tabs') {
        if (e.key === 'ArrowRight' ||
            e.key === 'ArrowLeft') {
          tabIdx = tabIdx === 0 ? 1 : 0;
          vidTab = tabEls[tabIdx].dataset.tab;
          buildVidGrid();
          updModalFoc();
        } else if (e.key === 'ArrowDown') {
          mArea = 'grid';
          updModalFoc();
        }
      } else {
        if (e.key === 'ArrowRight') {
          mIdx = (mIdx + 1) % mEls.length;
          updModalFoc();
        } else if (e.key === 'ArrowLeft') {
          mIdx = (mIdx - 1 + mEls.length) % mEls.length;
          updModalFoc();
        } else if (e.key === 'ArrowDown') {
          mIdx = Math.min(mEls.length - 1, mIdx + 4);
          updModalFoc();
        } else if (e.key === 'ArrowUp') {
          if (mIdx < 4 && modalMode === 'vids') {
            mArea = 'tabs';
            updModalFoc();
          } else {
            mIdx = Math.max(0, mIdx - 4);
            updModalFoc();
          }
        } else if (e.key === 'Enter' && mEls[mIdx]) {
          const val = mEls[mIdx].dataset.val;
          if (modalMode === 'apps') {
            if (window.AndroidLauncher) {
              window.AndroidLauncher.openApp(val);
            }
          } else if (modalMode === 'vids') {
            if (vidTab === 'norm') {
              normMode = val;
              startMode(normMode, normList);
            } else {
              afkMode = val;
            }
            closeModal();
          }
        }
      }
      return;
    }

    if (e.key === 'ArrowUp') {
      row = 'top'; renderFoc();
    } else if (e.key === 'ArrowDown') {
      row = 'bot'; renderFoc();
    } else if (e.key === 'ArrowRight') {
      if (row === 'top') {
        tIdx = (tIdx + 1) % topEls.length;
      } else {
        bIdx = (bIdx + 1) % botEls.length;
      }
      renderFoc();
    } else if (e.key === 'ArrowLeft') {
      if (row === 'top') {
        tIdx = (tIdx - 1 + topEls.length) % topEls.length;
      } else {
        bIdx = (bIdx - 1 + botEls.length) % botEls.length;
      }
      renderFoc();
    } else if (e.key === 'Enter') {
      const el = row === 'top'
        ? topEls[tIdx] : botEls[bIdx];
      const act = el.dataset.act;
      if (act === 'apps' || act === 'vids') {
        openModal(act);
      } else if (window.AndroidLauncher) {
        window.AndroidLauncher.openApp(act);
      }
    }
  });
</script>
</body>
</html>
