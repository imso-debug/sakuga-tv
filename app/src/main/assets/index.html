<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Sakuga TV</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: transparent; color: #fff;
    font-family: sans-serif; overflow: hidden;
    height: 100vh; width: 100vw; user-select: none;
  }
  .vig {
    position: fixed; inset: 0; z-index: -1;
    background: linear-gradient(180deg,
      rgba(7,8,12,.45) 0%, rgba(7,8,12,.15) 45%,
      rgba(7,8,12,.90) 100%);
    transition: opacity 0.8s linear;
  }
  #ui { height: 100vh; transition: opacity 0.8s; }
  body.afk #ui { opacity: 0; pointer-events: none; }
  body.afk .vig { opacity: 0.1; }
  #afk-clk {
    position: fixed; bottom: 40px; right: 55px;
    font-size: 36px; color: rgba(255,255,255,.55);
    opacity: 0; transition: opacity 0.8s;
  }
  body.afk #afk-clk { opacity: 1; }
  header {
    display: flex; justify-content: space-between;
    align-items: center; padding: 40px 60px;
  }
  .badge {
    background: rgba(18,20,30,.82);
    padding: 8px 18px; border-radius: 20px;
    font-size: 15px; letter-spacing: 1.5px;
    border: 1px solid rgba(255,255,255,.18);
  }
  .top-r {
    display: flex; align-items: center; gap: 18px;
  }
  #clk { font-size: 42px; font-weight: 300; }
  .t-btn {
    width: 54px; height: 54px; border-radius: 50%;
    background: rgba(20,23,34,.85);
    border: 2px solid rgba(255,255,255,.18);
    display: flex; justify-content: center;
    align-items: center; font-size: 22px;
    transition: transform 0.18s ease, border-color 0.18s;
  }
  .t-btn.foc {
    transform: scale(1.14); border-color: #7aa2f7;
    background: rgba(48,58,88,.95);
  }
  main {
    position: absolute; bottom: 60px;
    left: 60px; right: 60px;
  }
  .sec-t {
    font-size: 16px; text-transform: uppercase;
    letter-spacing: 2px; color: #ffffffb3;
    margin-bottom: 20px;
  }
  .dock { display: flex; gap: 24px; }
  .card {
    width: 260px; height: 145px;
    border-radius: 20px; padding: 16px;
    background: rgba(18,20,30,.84);
    border: 2px solid rgba(255,255,255,.15);
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    gap: 10px;
    transition: transform 0.18s ease, border-color 0.18s;
  }
  .card.lg {
    width: 440px;
    border-color: rgba(168,130,255,.35);
    background: linear-gradient(135deg,
      rgba(38,24,64,.88), rgba(20,24,42,.88));
  }
  .card.foc {
    transform: scale(1.05) translateY(-4px);
    background: rgba(40,48,72,.95);
    border-color: #7aa2f7;
  }
  .card.lg.foc {
    border-color: #bb9af7;
    background: linear-gradient(135deg,
      rgba(68,38,118,.95), rgba(34,44,82,.95));
  }
  .ico { font-size: 36px; }
  .nm { font-size: 19px; font-weight: 600; }
  .sb { font-size: 13px; color: #ffffffa6; }
  .modal {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(9,10,16,.96);
    padding: 45px 60px; display: none;
    flex-direction: column;
  }
  .modal.open { display: flex; }
  .m-head {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 22px;
  }
  .tabs {
    display: none; gap: 14px; margin-bottom: 24px;
  }
  .tabs.show { display: flex; }
  .tab {
    padding: 10px 22px; border-radius: 14px;
    background: rgba(255,255,255,.07);
    border: 2px solid transparent;
    font-size: 16px; color: #ffffff99;
  }
  .tab.act {
    background: rgba(122,162,247,.2);
    color: #fff; border-color: #7aa2f780;
  }
  .tab.foc {
    border-color: #bb9af7; color: #fff;
    transform: scale(1.04);
  }
  .m-grid {
    display: grid; gap: 18px; overflow-y: auto;
    grid-template-columns: repeat(4, 1fr);
    padding: 10px;
  }
  .m-item {
    background: rgba(255,255,255,.09);
    border: 2px solid rgba(255,255,255,.14);
    border-radius: 16px; padding: 20px;
    text-align: center; font-size: 17px;
    overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap;
  }
  .m-item.foc {
    background: rgba(122,162,247,.32);
    border-color: #7aa2f7;
    transform: scale(1.03);
  }
</style>
</head>
<body>

<div class="vig"></div>
<div id="afk-clk">00:00</div>

<div id="ui">
  <header>
    <div class="badge">SAKUGA TV • CLEAN</div>
    <div class="top-r">
      <div id="clk">00:00</div>
      <div class="t-btn nav" data-r="top"
           data-act="vids">🎬</div>
      <div class="t-btn nav" data-r="top"
           data-act="settings">⚙️</div>
    </div>
  </header>

  <main>
    <div class="sec-t">Кинотеатр и сервисы</div>
    <div class="dock">
      <div class="card lg nav foc" data-r="bot"
           data-act="ru.ivi.client">
        <div class="ico">⛩️🎬</div>
        <div class="nm">Аниме и Фильмы</div>
        <div class="sb">Открыть в ИВИ</div>
      </div>
      <div class="card nav" data-r="bot"
           data-act="ru.kinopoisk.tv">
        <div class="ico">🍿</div>
        <div class="nm">Кинопоиск</div>
        <div class="sb">Фильмы и сериалы</div>
      </div>
      <div class="card nav" data-r="bot"
           data-act="apps">
        <div class="ico">🎛️</div>
        <div class="nm">Все приложения</div>
        <div class="sb">Меню программ ТВ</div>
      </div>
    </div>
  </main>
</div>

<div class="modal" id="modal">
  <div class="m-head">
    <h2 id="m-title">Меню</h2>
    <span style="color:#ffffff80">
      «Назад» на пульте для выхода
    </span>
  </div>
  <div class="tabs" id="m-tabs">
    <div class="tab act" data-tab="norm">
      Обычный фон
    </div>
    <div class="tab" data-tab="afk">
      Режим АФК (сон)
    </div>
  </div>
  <div class="m-grid" id="m-grid"></div>
</div>
<script>
  const normList = [
    'sakuga1.mp4', 'sakuga2.mp4', 'sakuga3.mp4'
  ];
  const afkList = ['afk1.mp4', 'afk2.mp4'];
  const AFK_MS = 120000;

  // Настройки режимов: 'seq' (по очереди),
  // 'rnd' (случайно), или имя файла для повтора
  let normMode = 'seq', afkMode = 'seq';
  let vIdx = 0, isAfk = false;
  let afkTimer = null, modalMode = null;

  function playVid(name, loop) {
    if (window.AndroidLauncher &&
        window.AndroidLauncher.playVideo) {
      window.AndroidLauncher.playVideo(name, !!loop);
    }
  }

  function startMode(mode, arr) {
    if (mode === 'seq') {
      vIdx = 0;
      playVid(arr, false);
    } else if (mode === 'rnd') {
      vIdx = Math.floor(Math.random() * arr.length);
      playVid(arr[vIdx], false);
    } else {
      playVid(mode, true);
    }
  }

  // Старт обычного режима при запуске
  startMode(normMode, normList);

  function onVideoEnded() {
    const arr = isAfk ? afkList : normList;
    const mode = isAfk ? afkMode : normMode;
    if (mode !== 'seq' && mode !== 'rnd') return;

    if (mode === 'rnd' && arr.length > 1) {
      let next = vIdx;
      while (next === vIdx) {
        next = Math.floor(Math.random() * arr.length);
      }
      vIdx = next;
    } else {
      vIdx = (vIdx + 1) % arr.length;
    }
    playVid(arr[vIdx], false);
  }

  function onHardwareBack() {
    if (isAfk) { resetAfk(); return; }
    if (modalMode) { closeModal(); }
  }

  function setAfk(st) {
    if (isAfk === st) return;
    isAfk = st;
    document.body.classList.toggle('afk', st);
    if (st) startMode(afkMode, afkList);
    else startMode(normMode, normList);
  }

  function resetAfk() {
    clearTimeout(afkTimer);
    if (!modalMode) {
      afkTimer = setTimeout(() => setAfk(true), AFK_MS);
    }
    if (isAfk) setAfk(false);
  }
  resetAfk();

  function tick() {
    const d = new Date();
    const h = String(d.getHours()).padStart(2, '0');
    const m = String(d.getMinutes()).padStart(2, '0');
    document.getElementById('clk').textContent = h+':'+m;
    document.getElementById('afk-clk').textContent = h+':'+m;
  }
  setInterval(tick, 1000); tick();

  const topEls = Array.from(
    document.querySelectorAll('[data-r="top"]')
  );
  const botEls = Array.from(
    document.querySelectorAll('[data-r="bot"]')
  );
  const tabEls = Array.from(
    document.querySelectorAll('.tab')
  );
  let row = 'bot', tIdx = 0, bIdx = 0;
  let mArea = 'grid', tabIdx = 0, vidTab = 'norm';
  let mEls = [], mIdx = 0;

  function renderFoc() {
    document.querySelectorAll('.nav')
      .forEach(e => e.classList.remove('foc'));
    if (row === 'top') topEls[tIdx].classList.add('foc');
    else botEls[bIdx].classList.add('foc');
  }

  function buildVidGrid() {
    const grid = document.getElementById('m-grid');
    grid.innerHTML = '';
    const arr = vidTab === 'norm' ? normList : afkList;
    const items = [
      {name: '🔄 По очереди', val: 'seq'},
      {name: '🎲 Случайно', val: 'rnd'}
    ];
    arr.forEach(v => {
      items.push({name: '🎬 ' + v, val: v});
    });
    items.forEach((it, i) => {
      const div = document.createElement('div');
      div.className = 'm-item';
      div.textContent = it.name;
      div.dataset.val = it.val;
      grid.appendChild(div);
    });
    mEls = Array.from(
      document.querySelectorAll('.m-item')
    );
    mIdx = 0;
  }

  function openModal(mode) {
    modalMode = mode;
    clearTimeout(afkTimer);
    const grid = document.getElementById('m-grid');
    const title = document.getElementById('m-title');
    const tabs = document.getElementById('m-tabs');
    grid.innerHTML = '';

    if (mode === 'apps') {
      title.textContent = 'Все приложения';
      tabs.classList.remove('show');
      mArea = 'grid';
      let items = [];
      if (window.AndroidLauncher &&
          window.AndroidLauncher.getApps) {
        items = JSON.parse(
          window.AndroidLauncher.getApps()
        );
      }
      items.forEach((it) => {
        const div = document.createElement('div');
        div.className = 'm-item';
        div.textContent = it.name;
        div.dataset.val = it.pkg;
        grid.appendChild(div);
      });
      mEls = Array.from(
        document.querySelectorAll('.m-item')
      );
      mIdx = 0;
    } else if (mode === 'vids') {
      title.textContent = 'Настройка фонового видео';
      tabs.classList.add('show');
      vidTab = 'norm'; tabIdx = 0; mArea = 'grid';
      buildVidGrid();
    }
    updModalFoc();
    document.getElementById('modal')
      .classList.add('open');
  }

  function closeModal() {
    modalMode = null;
    document.getElementById('modal')
      .classList.remove('open');
    resetAfk();
  }

  function updModalFoc() {
    tabEls.forEach((t, i) => {
      t.classList.toggle('act', t.dataset.tab === vidTab);
      t.classList.toggle(
        'foc', modalMode === 'vids' &&
        mArea === 'tabs' && i === tabIdx
      );
    });
    mEls.forEach((el, i) => {
      el.classList.toggle(
        'foc', mArea === 'grid' && i === mIdx
      );
    });
    if (mArea === 'grid' && mEls[mIdx]) {
      mEls[mIdx].scrollIntoView({block: 'nearest'});
    }
  }

  document.addEventListener('keydown', (e) => {
    if (isAfk) { resetAfk(); return; }
    resetAfk();

    if (modalMode) {
      if (['Escape','Backspace','GoBack']
          .includes(e.key)) {
        closeModal();
      } else if (mArea === 'tabs') {
        if (e.key === 'ArrowRight' ||
            e.key === 'ArrowLeft') {
          tabIdx = tabIdx === 0 ? 1 : 0;
          vidTab = tabEls[tabIdx].dataset.tab;
          buildVidGrid();
          updModalFoc();
        } else if (e.key === 'ArrowDown') {
          mArea = 'grid';
          updModalFoc();
        }
      } else {
        if (e.key === 'ArrowRight') {
          mIdx = (mIdx + 1) % mEls.length;
          updModalFoc();
        } else if (e.key === 'ArrowLeft') {
          mIdx = (mIdx - 1 + mEls.length) % mEls.length;
          updModalFoc();
        } else if (e.key === 'ArrowDown') {
          mIdx = Math.min(mEls.length - 1, mIdx + 4);
          updModalFoc();
        } else if (e.key === 'ArrowUp') {
          if (mIdx < 4 && modalMode === 'vids') {
            mArea = 'tabs';
            updModalFoc();
          } else {
            mIdx = Math.max(0, mIdx - 4);
            updModalFoc();
          }
        } else if (e.key === 'Enter' && mEls[mIdx]) {
          const val = mEls[mIdx].dataset.val;
          if (modalMode === 'apps') {
            if (window.AndroidLauncher) {
              window.AndroidLauncher.openApp(val);
            }
          } else if (modalMode === 'vids') {
            if (vidTab === 'norm') {
              normMode = val;
              startMode(normMode, normList);
            } else {
              afkMode = val;
            }
            closeModal();
          }
        }
      }
      return;
    }

    if (e.key === 'ArrowUp') {
      row = 'top'; renderFoc();
    } else if (e.key === 'ArrowDown') {
      row = 'bot'; renderFoc();
    } else if (e.key === 'ArrowRight') {
      if (row === 'top') {
        tIdx = (tIdx + 1) % topEls.length;
      } else {
        bIdx = (bIdx + 1) % botEls.length;
      }
      renderFoc();
    } else if (e.key === 'ArrowLeft') {
      if (row === 'top') {
        tIdx = (tIdx - 1 + topEls.length) % topEls.length;
      } else {
        bIdx = (bIdx - 1 + botEls.length) % botEls.length;
      }
      renderFoc();
    } else if (e.key === 'Enter') {
      const el = row === 'top'
        ? topEls[tIdx] : botEls[bIdx];
      const act = el.dataset.act;
      if (act === 'apps' || act === 'vids') {
        openModal(act);
      } else if (window.AndroidLauncher) {
        window.AndroidLauncher.openApp(act);
      }
    }
  });
</script>
</body>
</html>
